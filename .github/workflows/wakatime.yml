name: WakaReadMe

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime Language Card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Custom WakaTime SVG Cards
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHARE_URL: "https://wakatime.com/share/@Regeents/4f3f0e51-e889-4d3a-b686-43baf470a909.json"
        run: node .github/scripts/generate-waka-card.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/wakatime/
          git diff --staged --quiet || (git commit -m "chore: update custom WakaTime language cards" && git push)
